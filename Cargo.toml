[workspace]
members = ["crates/macros", "bake"]
resolver = "3"

[workspace.package]
version = "0.20.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/core-rs/bake"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
tempfile = "3.27"
linkme = "0.3"
toml_edit = "0.25"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["core-rs/maintainers"]

[[workspace.metadata.bake.test.external]]
repository = "https://github.com/core-rs/bake-agent-context"
branch = "main"

[[workspace.metadata.bake.test.external]]
repository = "https://github.com/core-rs/bake-cargo"
branch = "main"

[[workspace.metadata.bake.test.external]]
repository = "https://github.com/core-rs/bake-license"
branch = "main"

[[workspace.metadata.bake.test.external]]
repository = "https://github.com/core-rs/bake-readme"
branch = "main"

[[workspace.metadata.bake.test.external]]
repository = "https://github.com/core-rs/bake-releases"
branch = "main"

[[workspace.metadata.bake.test.external]]
repository = "https://github.com/core-rs/bake-test"
branch = "main"

[package]
name = "bake"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable, typed development tasks and Cargo launcher for Rust projects"
readme = "readme.md"
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[lib]
name = "bake"

[[bin]]
name = "cargo-bake"
path = "src/bin/cargo-bake/main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[dependencies]
toml_edit.workspace = true
serde.workspace = true
serde_json.workspace = true
linkme.workspace = true
bake-macros = { version = "0.20.0", path = "crates/macros" }

[dev-dependencies]
tempfile.workspace = true

[patch.crates-io]
bake = { path = "." }
